name: Build AnimeWallpaper Provider

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone official Projectivy provider template
        run: git clone --depth 1 https://github.com/spocky/projectivy-plugin-wallpaper-provider.git template

      - name: Install AnimeWallpaper provider
        run: |
          set -e
          APP=template/sample/src/main
          PKG=$APP/java/tv/projectivy/plugin/wallpaperprovider/sample
          mkdir -p "$PKG"
          cp provider/WallpaperProviderService.kt "$PKG/WallpaperProviderService.kt"
          cp provider/SettingsActivity.kt "$PKG/SettingsActivity.kt"
          cp provider/AndroidManifest.xml "$APP/AndroidManifest.xml"

      - name: Configure provider resources
        working-directory: template
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def set_value(path, tag, name, value):
              p=Path(path)
              tree=ET.parse(p)
              root=tree.getroot()
              found=None
              for child in root:
                  if child.tag.split('}')[-1] == tag and child.attrib.get('name') == name:
                      found=child; break
              if found is None:
                  found=ET.SubElement(root, tag, {'name':name})
              found.text=value
              tree.write(p, encoding='utf-8', xml_declaration=True)

          set_value('sample/src/main/res/values/strings.xml','string','plugin_name','AnimeWallpaper')
          set_value('sample/src/main/res/values/strings.xml','string','plugin_description','TV-friendly anime wallpapers from r/Animewallpaper')
          set_value('sample/src/main/res/values/strings.xml','string','plugin_uuid','ecd5d719-49e7-4df0-b408-e31bbd9d2559')
          set_value('sample/src/main/res/values/integers.xml','integer','items_cache_duration_millis','1800000')
          PY2

      - name: Verify Projectivy metadata
        working-directory: template
        run: |
          set -e
          grep -q 'AnimeWallpaper' sample/src/main/res/values/strings.xml
          grep -q 'ecd5d719-49e7-4df0-b408-e31bbd9d2559' sample/src/main/res/values/strings.xml
          grep -q 'tv.projectivy.plugin.WALLPAPER_PROVIDER' sample/src/main/AndroidManifest.xml
          grep -q 'android:name="uuid"' sample/src/main/AndroidManifest.xml
          grep -q 'android:name="name"' sample/src/main/AndroidManifest.xml
          grep -q 'android:name=".WallpaperProviderService"' sample/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: template
        run: |
          chmod +x gradlew
          ./gradlew :sample:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeWallpaper
          path: template/sample/build/outputs/apk/debug/*.apk
          if-no-files-found: error
